services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    volumes:
      - backend_data:/data
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  backend_data:

networks:
  internal:
